[package]
name = "sqlite-doctor"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Checks SQLite migration SQL for table rebuilds that can delete or change dependent rows, or drop indexes and triggers"
license = "MIT"
repository = "https://github.com/kholdrex/sqlite-doctor"
publish = false

[lib]
name = "sqlite_doctor"
path = "src/lib.rs"

[[bin]]
name = "sqlite-doctor"
path = "src/main.rs"

[dependencies]
serde_json = "1"
