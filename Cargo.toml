[package]
name = "sqlite-doctor"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "Checks SQLite migration SQL for table rebuilds that can delete or change dependent rows, or drop indexes and triggers"
license = "MIT"
repository = "https://github.com/kholdrex/sqlite-doctor"
keywords = ["sqlite", "migrations", "lint", "foreign-keys", "database"]
categories = ["command-line-utilities", "database", "development-tools"]
exclude = [".github/", "action.yml", "contrib/drizzle/", "dist-workspace.toml", "sqlite_doctor.gemspec"]

[lib]
name = "sqlite_doctor"
path = "src/lib.rs"

[[bin]]
name = "sqlite-doctor"
path = "src/main.rs"

[dependencies]
serde_json = "1"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
