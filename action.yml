name: Set up sqlite-doctor
description: Installs a released sqlite-doctor binary, checks its SHA-256 and adds it to PATH.
branding:
  icon: database
  color: blue
inputs:
  version:
    description: Release to install, such as 0.3.0. Defaults to the version in the tag this action is used at.
    required: false
    default: ""
outputs:
  version:
    description: The installed version.
    value: ${{ steps.install.outputs.version }}
runs:
  using: composite
  steps:
    - id: install
      shell: bash
      env:
        REQUESTED_VERSION: ${{ inputs.version }}
        ACTION_REF: ${{ github.action_ref }}
      run: |
        set -euo pipefail
        version="${REQUESTED_VERSION#v}"
        if [ -z "$version" ]; then
          if [[ "$ACTION_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            version="${ACTION_REF#v}"
          else
            echo "::error::set the version input, or use this action at a release tag such as @v0.3.0"
            exit 1
          fi
        fi
        if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
          echo "::error::'$version' is not a release version"
          exit 1
        fi
        case "$RUNNER_OS/$RUNNER_ARCH" in
          Linux/X64) target=x86_64-unknown-linux-gnu ;;
          macOS/ARM64) target=aarch64-apple-darwin ;;
          *)
            echo "::error::no sqlite-doctor build for $RUNNER_OS/$RUNNER_ARCH; use 'cargo install sqlite-doctor'"
            exit 1
            ;;
        esac
        archive="sqlite-doctor-$target.tar.xz"
        base="https://github.com/kholdrex/sqlite-doctor/releases/download/v$version"
        directory="$RUNNER_TEMP/sqlite-doctor-$version"
        mkdir -p "$directory"
        curl --proto '=https' --tlsv1.2 -fsSL --retry 3 -o "$directory/$archive" "$base/$archive"
        curl --proto '=https' --tlsv1.2 -fsSL --retry 3 -o "$directory/$archive.sha256" "$base/$archive.sha256"
        expected=$(cut -d ' ' -f 1 "$directory/$archive.sha256")
        if command -v sha256sum >/dev/null; then
          actual=$(sha256sum "$directory/$archive" | cut -d ' ' -f 1)
        else
          actual=$(shasum -a 256 "$directory/$archive" | cut -d ' ' -f 1)
        fi
        if [ -z "$expected" ] || [ "$expected" != "$actual" ]; then
          echo "::error::checksum mismatch for $archive"
          exit 1
        fi
        tar -xJf "$directory/$archive" -C "$directory"
        "$directory/sqlite-doctor-$target/sqlite-doctor" --help >/dev/null
        echo "$directory/sqlite-doctor-$target" >> "$GITHUB_PATH"
        echo "version=$version" >> "$GITHUB_OUTPUT"
