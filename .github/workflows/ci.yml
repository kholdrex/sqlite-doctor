name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: cargo test
        run: cargo test --all-features
      - name: fixtures against sqlite3
        run: sh tests/sqlite_outcomes.sh
      - name: cargo run
        run: cargo run -- --help

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - name: cargo test on the minimum supported Rust version
        run: cargo test --locked --all-features

  rails-capture:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        activerecord: ["7.1.5.1", "7.2.2.1", "8.1.4"]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - uses: dtolnay/rust-toolchain@stable
      - name: build the sqlite-doctor binary
        run: cargo build
      - name: capture tests
        env:
          AR_VERSION: ${{ matrix.activerecord }}
        run: ruby contrib/rails/test/capture_test.rb
      - name: check tests
        env:
          AR_VERSION: ${{ matrix.activerecord }}
        run: ruby contrib/rails/test/check_test.rb
      - name: Rails application tests
        env:
          AR_VERSION: ${{ matrix.activerecord }}
        run: ruby contrib/rails/test/railtie_test.rb
      - name: gem builds
        run: gem build sqlite_doctor.gemspec
