name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: cargo test
        run: cargo test --all-features
      - name: cargo run
        run: cargo run -- --help

  rails-capture:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        activerecord: ["7.1.5.1", "7.2.2.1", "8.1.4"]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: capture helper tests
        env:
          AR_VERSION: ${{ matrix.activerecord }}
        run: ruby contrib/rails/test/capture_test.rb
